[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isr-forge"
version = "0.1.0"
description = "Neuro-symbolic agent that designs DoD Group 1-3 ISR UAVs from operational requirements"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Heavy physics/CAD stack: installed in Docker, needed from Milestone 2 onwards.
physics = [
    "aerosandbox>=4.2.10",
    "neuralfoil",
    "casadi",
    "build123d",
    "jsbsim",
    "pymavlink",
]
agent = [
    "langgraph",
    "anthropic>=2.8",  # structured outputs + server-side refusal fallback (beta.messages.parse)
    "openai>=1.99",  # OpenRouter's OpenAI-compatible API (chat.completions.parse with strict JSON schema)
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
ui = [
    "streamlit>=1.38",
]

[project.scripts]
isr-forge = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
# The 3D viewer page is assembled at run time from these non-Python files (vendor/ is Three.js, MIT).
"src.viewer" = ["*.html", "*.js", "vendor/*.js", "vendor/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: requires the OpenVSP/ArduPilot/JSBSim binaries from the Docker image",
]

[tool.coverage.run]
source = ["src"]
